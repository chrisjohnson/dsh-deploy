llm-pi-ai:
  providers:
    # Two providers, but as of 2026-08-21 BOTH talk directly to litellm
    # (:4000), not through litellm-queue-haproxy-strix-apu/-r9700-egpu-dock.
    # Those two haproxy instances were added on the assumption that
    # concurrent GPU access was worse than serialized single-request-at-a-time
    # access - a real A/B test found the opposite: 2 simultaneous requests
    # against one GPU genuinely parallelized (higher aggregate throughput, not worse),
    # so the forced serialization was net-negative, not protective. The
    # haproxy containers are left defined/running for now (not torn down)
    # in case this needs revisiting, but nothing routes through them.
    #
    # Kept as two providers (not consolidated into one) purely for the
    # dsh model-picker UX - it groups by provider, so this keeps
    # strix-apu vs r9700-egpu-dock roles visually separated even though
    # both now resolve through the same litellm instance. litellm role
    # IDs (medium-dense, medium-moe, etc.) stay exactly as-is and are NOT
    # renamed per-GPU - the same role name can safely appear under (at
    # most) one provider's models: list at a time without any
    # collision/ambiguity risk.
    #
    # A role lives under whichever provider matches its CURRENTLY-pinned
    # GPU, per scripts/set-role.sh's own GPU-hint output - this is
    # manual-sync state (same deliberate philosophy docker/litellm/
    # config.yaml's own header documents for why role values aren't
    # git-tracked either), not automatically derived. If a role gets
    # reassigned to a different GPU via set-role.sh, move its entry to
    # match.
    local-ai-machine:
      displayName: local-ai-machine
      apiKeyEnv: LOCAL_AI_MACHINE_API_KEY
      api: openai-completions
      # Reached via 127.0.0.1, not a container DNS name or host.docker.internal:
      # dsh itself is network_mode: host (see docker-compose.yml's dsh
      # service comment), so it shares the host's own network namespace directly,
      # same as litellm (also network_mode: host, bound straight to the host's
      # :4000) - direct, no haproxy queue in between (see header above).
      baseURL: http://127.0.0.1:4000/v1
      # contextWindow/maxTokens (2026-08-21): pi-ai's own README is explicit
      # that a hand-declared route (neither of these providers is in pi-ai's
      # installed catalog) falls back to the ROUTE's defaultContextWindow
      # (262,144) / defaultMaxTokens (32,768) for any model that doesn't
      # size itself - and we were never setting either, so pi-ai silently
      # assumed a context window exactly 2x the real one. Confirmed live:
      # a medium-dense session hit `finish {reason: {kind: 'max-tokens'}}`
      # with cacheReadTokens+inputTokens+outputTokens landing at exactly
      # 131072 (the real -c 131072 on every GGUF build below, confirmed by
      # grepping each build's docker-compose.yaml directly) while dsh's own
      # UI reported the session only ~50% full - it was computing that
      # percentage against the wrong 262144 denominator. This is also why
      # compaction-basic's thresholdRatio: 0.6 fix never actually
      # fired here: 60% of the WRONG 262144 (157,286) is past the point
      # where the REAL backend runs out of room at 131072, so the session
      # ran all the way to a native cutoff before compaction ever got a
      # chance to run.
      #
      # small-moe/small-dense (2026-08-22): confirmed via litellm's own
      # /model/info (queried through set-role.sh's exact credential-loading
      # pattern - LITELLM_MASTER_KEY read from docker/.env, never printed -
      # so this didn't need the raw key handled directly). small-moe ->
      # glm-4.7-flash--llamacpp-vulkan-radv-strix-apu-v1 (-c 65536, no
      # explicit -n cap set); small-dense ->
      # qwen2.5-vl-7b-instruct--vllm-therock-gfx1151-strix-apu-v1
      # (--max-model-len 32768, no explicit output cap set). maxTokens left
      # unset for both (matching the absence of a real serving-config cap)
      # rather than guessed - pi-ai's 32,768 route default comfortably fits
      # under both real context windows either way, so leaving it unset is
      # safe here, unlike contextWindow which was actively wrong.
      models:
        - id: small-moe
          contextWindow: 65536
        - id: small-dense
          contextWindow: 32768
        - id: medium-moe
          contextWindow: 131072
          maxTokens: 8192
        - id: big-moe
          contextWindow: 131072
          maxTokens: 8192
        - id: big-moe-continue-json
          contextWindow: 131072
          maxTokens: 8192
        - id: medium-moe-continue-json
          contextWindow: 131072
          maxTokens: 8192
    # r9700-egpu-dock roles - only roles currently pinned to a build
    # running on that GPU belong here. Today that's just medium-dense
    # (Qwen3.8-27B-MTP) - most roles (especially big-moe, Laguna-S-2.1
    # 118B) will likely never fit r9700-egpu-dock's 32GB dedicated VRAM
    # at all, so this list is expected to stay short. Same litellm
    # instance as local-ai-machine above (:4000, direct, no haproxy) -
    # see header comment.
    local-ai-machine-r9700:
      displayName: local-ai-machine (r9700-egpu-dock)
      apiKeyEnv: LOCAL_AI_MACHINE_API_KEY
      api: openai-completions
      baseURL: http://127.0.0.1:4000/v1
      # See the local-ai-machine provider's contextWindow/maxTokens comment
      # above - same fix, same root cause. This is the role that actually
      # surfaced the bug (2026-08-21).
      #
      # contextWindow bumped 131072 -> 262144 (2026-08-22): medium-dense now
      # routes to qwen3.8-27b-q6kl--llamacpp-vulkan-radv-r9700-mtp-v1
      # (Q6_K_L, full native context, q4_0 KV cache - see that build's
      # build.yaml), which really runs -c 262144, not 131072. maxTokens
      # unchanged (still -n 8192 on the new build too).
      models:
        - id: medium-dense
          contextWindow: 262144
          maxTokens: 8192
agent-default-model:
  provider: local-ai-machine
  model: medium-moe
# Local variants of the shipped "standard" and "code" (PTC mode) presets
# with compaction-basic's thresholdRatio lowered 0.8 -> 0.6 — a
# session got permanently stuck when compaction never got a chance to run
# before the live conversation itself filled the context window; see
# dsh-home-seed/agent-presets/{standard,code}-local/agent.cordis.yml for
# the full incident writeup. The session that actually hit this was
# running PTC mode, not standard — both needed the identical patch, since
# each preset mounts its own separate compaction-basic instance.
#
# Default set to code-local (PTC), matching actual daily usage on this
# box, not standard-local — a session created without explicitly picking
# a preset should get the mode that's actually used, not an unused one
# that merely happens to share a name convention. Picking "PTC mode" from
# the New Session dropdown still selects the ORIGINAL shipped, unfixed
# preset — the shipped and local copies are necessarily two separate
# dropdown entries (preset ids can't collide), so anyone deliberately
# choosing a preset by name needs to pick the one labeled
# "(local-ai-machine, early compaction)" for the fix to apply.
agent-presets:
  default: code-local
ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
