# Patch layer for the web profile, applied after every bundle layer.
# dsh-web-search-searxng ships its OWN patch layer (activates on inclusion
# in `bundles` below - switches ctx.web's search provider to searxng and
# mounts the plugin row) via its `dsh.bundle.patch` package.json field, so
# no hand-written insert is needed for that. dsh-context, dsh-better-sidebar,
# dsh-git-worktree, and dsh-playwright-browser work the same way - all four
# ship their own `dsh.bundle.patch` and mount purely from inclusion in
# `bundles` below, so none of them needs an `insert:` row here either -
# playwright-browser gets a plain config-override row instead (see below),
# since it self-mounts under id `playwright-browser` already.

# Chris's explicit request (M-154, replaces the old Docker image's bare
# global playwright CLI): dsh-playwright-browser gives dsh proper
# browser_* tools instead of shell-invoked one-liners, and unlike the CLI
# has a real persistent viewport config the agent doesn't have to
# remember to pass every time. 1920x1080 (Chris's explicit choice) vs the
# plugin's own 1280x800 default - was producing screenshots at a scale
# noticeably smaller than Chris's own display.
- id: playwright-browser
  config:
    viewportWidth: 1920
    viewportHeight: 1080
#
# No settings-path redirect here (the old Docker cordis.patch.yml carried
# one): that was purely a bind-mount rename limitation
# (dsh-atomic-write commits every settings write via a same-directory
# temp file + rename, which can't replace an active single-file Docker
# bind mount). $DSH_HOME/settings.yaml on a real filesystem needs no
# override - confirmed working in M-153.

# Host-plane auto-continue watcher.
# DSH equivalent of local-ai-machine's pi-web-session-watcher, but
# in-process rather than an external poller - dsh's session/agent registries
# are directly reachable from host-plane plugin code, so no separate service
# or REST polling is needed the way pi-web (a closed prebuilt image) required.
#
# Two triggers feed one shared decision function:
#
#   - agent/created tail inspection - the path for crash recovery
#     ('interrupted' markers are synthesized during session load and never
#     publish live) and for reopen-after-the-fact cases.
#   - Live watcher per agent on agent.ctx 'session/event': 'max-tokens'
#     IS a real streamed finish reason (unlike interrupted), and unattended
#     halts have no reopen event to lean on. Schedules a delayed
#     re-analysis of the same tail guards rather than acting on the raw
#     event.
#
# Kick conditions: unresolved 'interrupted' boundary, or any 'max-tokens'
# boundary (no content-shape check on the final message - kind ===
# 'max-tokens' is always a budget-cut generation, never a model-chosen
# stop). Deliberately does NOT fire on 'completed', 'aborted', 'error',
# tails already followed by a user/assistant message (recovered manually
# or otherwise), subagent sessions by default (auto-kicking a delegated
# child fights its parent orchestrator's own retry flow), or after
# maxConsecutiveKicks consecutive kicks with no progress (runaway guard
# against think-cap-think loops; logs loudly instead of kicking).
# Max-tokens kicks use a reason-aware prompt forbidding re-derivation of
# the lost reasoning. Every kick AND skip is logged with its reason - see
# .dsh/profiles/web/plugins/continue-kicker.mjs for the full rationale.
- insert:
    - id: continue-kicker
      name: ./plugins/continue-kicker.mjs
      config:
        cooldownMs: 60000
        liveKickDelayMs: 3000
        maxConsecutiveKicks: 3
        kickOnInterrupted: true
        kickOnMaxTokens: true
        includeSubagents: false

    # Model-facing image_search tool over the same self-hosted SearXNG
    # instance dsh-web-search-searxng uses for text search, querying its
    # `images` category. Same env-var convention as dsh-web-search-searxng
    # (SEARXNG_BASE_URL / SEARXNG_API_KEY) so no new deployment config is
    # needed. See plugins/image-search-searxng.mjs for why this is a
    # standalone tool rather than an extension of web_search/dsh-web, and
    # why it returns markdown links rather than real image attachments.
    - id: image-search-searxng
      name: ./plugins/image-search-searxng.mjs
      config:
        baseURL: !!js process.env.SEARXNG_BASE_URL ?? 'http://localhost:8888'
        maxResults: !!js Number(process.env.SEARXNG_NUM_RESULTS ?? 8)
        apiKey: !!js process.env.SEARXNG_API_KEY

    # "System 1" semantic loop watchdog.
    # Intercepts the agent loop before each turn, analyzes the recent
    # trajectory (last 6 events), and asks the orchestrator model
    # (medium-moe, local-ai-machine) to classify it as PROGRESS or LOOP
    # in a single non-autoregressive prefill pass (maxTokens: 1,
    # temperature: 0.0). On LOOP, injects a developer correction message.
    # Fail-open: LLM errors/timeouts are logged and the turn proceeds
    # natively. Per-session cooldown prevents performance drag.
    - id: semantic-loop-kicker
      name: ./plugins/semantic-loop-kicker.mjs
      config:
        cooldownMs: 30000
        maxTranscriptLines: 6
        includeSubagents: false
        interventionEnabled: true

    # In-session model switching for the agent itself: `switch_model`
    # (agent picks provider/model + the first message the new model receives)
    # and `switch_model_escalate` (escape hatch - no arguments needed;
    # deployment policy picks the route). Reuses the
    # sessionController.selectModel path (same validation, durable
    # model/selection event, "model changed" boundary notice, default-model
    # persistence as the UI) plus agent.steer() so the notice is delivered
    # immediately after the switch, before the new model picks up other work.
    # See plugins/model-switch.mjs for the full rationale.
    - id: model-switch
      name: ./plugins/model-switch.mjs
      config:
        escalationProvider: local-ai-machine
        escalationModel: medium-dense
